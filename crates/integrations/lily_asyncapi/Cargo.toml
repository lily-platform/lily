[package]
name = "lily_asyncapi"
version = "0.1.0"
edition = "2024" 
description = "Transport-neutral AsyncAPI document foundation for Lilyrs applications"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "asyncapi", "schema", "websocket", "rabbitmq"]
categories = ["web-programming"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[features]
default = []

[dependencies]
mime = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = []
