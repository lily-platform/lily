[package]
name = "lily_core"
version = "0.1.0"
edition = "2024"
description = "Shared environment and HTTP primitives for Lilyrs framework components"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "framework", "environment", "http", "backend"]
categories = ["rust-patterns"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[dependencies]
tracing = { workspace = true }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = []
