[package]
name = "umbrella-macro-trace-renamed"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Only this component is enabled; no other facade feature may mask macro paths.
platform = { package = "lilyrs", path = "../../../../crates/lilyrs", default-features = false, features = ["trace"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
