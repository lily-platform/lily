[package]
name = "component-facade-postgresql"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The only direct Lily dependency. No derive, registry, DI or helper crates.
lily_postgresql = { package = "lily_postgresql", path = "../../../../crates/integrations/lily_postgresql", default-features = false }

diesel = { version = "=2.3.11", default-features = false, features = ["postgres_backend", "uuid"] } # table! requires the driver name.

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["single"]
single = ["lily_postgresql/single"]
factory = ["lily_postgresql/factory"]
