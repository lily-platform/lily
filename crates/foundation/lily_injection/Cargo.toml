[package]
name = "lily_injection"
version = "0.1.0"
edition = "2024"
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
exclude = ["examples/**", "tests/**"]

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
lily_trace = { version = "0.1.0", path = "../../integrations/lily_trace" }
lily_core = { version = "0.1.0", path = "../lily_core" }
lily_error = { version = "0.1.0", path = "../lily_error" }
lily_injection_registry = { version = "0.1.0", path = "../lily_injection_registry" }
lily_injectable_derive = { version = "0.1.0", path = "../lily_injectable_derive" }
lily_process = { version = "0.1.0", path = "../lily_process" }
opentelemetry = "0.30"
tracing = "0.1"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
opentelemetry_sdk = { version = "0.30", features = ["testing"] }
tracing-opentelemetry = "0.31"
linkme = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
