[package]
name = "umbrella-feature-matrix"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lilyrs = { path = "../../../../crates/lilyrs", default-features = false }

[features]
default = []
consumer = ["lilyrs/consumer"]
http-api = ["lilyrs/http-api"]
websocket = ["lilyrs/websocket"]
websocket-redis = ["lilyrs/websocket-redis"]
clickhouse = ["lilyrs/clickhouse"]
clickhouse-single = ["lilyrs/clickhouse-single"]
clickhouse-factory = ["lilyrs/clickhouse-factory"]
mongodb = ["lilyrs/mongodb"]
mongodb-single = ["lilyrs/mongodb-single"]
mongodb-factory = ["lilyrs/mongodb-factory"]
postgresql = ["lilyrs/postgresql"]
postgresql-single = ["lilyrs/postgresql-single"]
postgresql-factory = ["lilyrs/postgresql-factory"]
queue = ["lilyrs/queue"]
queue-client = ["lilyrs/queue-client"]
queue-client-single = ["lilyrs/queue-client-single"]
queue-client-factory = ["lilyrs/queue-client-factory"]
redis = ["lilyrs/redis"]
redis-single = ["lilyrs/redis-single"]
redis-factory = ["lilyrs/redis-factory"]
trace = ["lilyrs/trace"]
trace-console = ["lilyrs/trace-console"]
config = ["lilyrs/config"]
websocket-client = ["lilyrs/websocket-client"]
websocket-client-single = ["lilyrs/websocket-client-single"]
websocket-client-factory = ["lilyrs/websocket-client-factory"]
injection = ["lilyrs/injection"]
http-client = ["lilyrs/http-client"]
error = ["lilyrs/error"]
background-service = ["lilyrs/background-service"]
cancellation = ["lilyrs/cancellation"]
consumer-asyncapi = ["lilyrs/consumer-asyncapi"]
consumer-fuzzing = ["lilyrs/consumer-fuzzing"]
consumer-transactional-inbox-mongodb = ["lilyrs/consumer-transactional-inbox-mongodb"]
consumer-transactional-inbox-mongodb-factory = ["lilyrs/consumer-transactional-inbox-mongodb-factory"]
consumer-transactional-inbox-postgresql = ["lilyrs/consumer-transactional-inbox-postgresql"]
consumer-transactional-inbox-postgresql-factory = ["lilyrs/consumer-transactional-inbox-postgresql-factory"]
http-api-fuzzing = ["lilyrs/http-api-fuzzing"]
websocket-fuzzing = ["lilyrs/websocket-fuzzing"]
mongodb-factory-api = ["lilyrs/mongodb-factory-api"]
