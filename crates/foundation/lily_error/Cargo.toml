[package]
name = "lily_error"
version = "0.1.0"
edition = "2024"
description = "Shared typed application and infrastructure errors for Lilyrs components"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "error", "error-handling", "framework", "localization"]
categories = ["rust-patterns"]
rust-version.workspace = true

[features]
default = []
mongodb-driver = ["dep:mongodb"]

[dependencies]
mongodb = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
