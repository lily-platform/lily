cancellation = ["lily/cancellation"]
consumer-asyncapi = ["lily/consumer-asyncapi"]
consumer-fuzzing = ["lily/consumer-fuzzing"]
consumer-transactional-inbox-mongodb = ["lily/consumer-transactional-inbox-mongodb"]
