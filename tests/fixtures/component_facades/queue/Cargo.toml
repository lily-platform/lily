[package]
name = "component-facade-queue"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The only direct Lily dependency. No derive, registry, DI or helper crates.
lily_queue = { package = "lily_queue", path = "../../../../crates/integrations/lily_queue", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
asyncapi = ["lily_queue/asyncapi"]
