[package]
name = "lily_queue_derive"
version = "0.1.0"
edition = "2021"
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
default = []
asyncapi = ["dep:serde_json"]

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
proc-macro-crate = "3"
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
lily_injection = { path = "../../foundation/lily_injection" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
trybuild = "1.0"
lily_error = { version = "0.1.0", path = "../../foundation/lily_error" }
queue_runtime = { package = "lily_queue", version = "=0.1.0", path = "../lily_queue" }
