[workspace]
resolver = "3"

[package]
name = "lily-example-client"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96.1"

[dependencies]
lilyrs = { path = "../../crates/lilyrs", default-features = false, features = ["http-client", "websocket-client"] }
lily-example-models = { path = "../models" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
