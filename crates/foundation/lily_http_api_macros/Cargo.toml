[package]
name = "lily_http_api_macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for Lilyrs HTTP controllers and multipart DTOs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "http", "controller", "openapi", "proc-macro"]
categories = ["web-programming::http-server", "development-tools"]
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn.workspace = true
proc-macro-crate = "3"
