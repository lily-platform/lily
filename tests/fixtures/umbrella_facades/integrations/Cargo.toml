[package]
name = "umbrella-integrations"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The only direct Lily dependency, deliberately excluding implementation crates.
lilyrs = { package = "lilyrs", path = "../../../../crates/lilyrs", default-features = false, features = ["config", "http-client", "error", "background-service", "trace", "queue", "cancellation", "websocket", "websocket-redis"] }
serde = { version = "1", features = ["derive"] }

tokio = { version = "1", features = ["macros", "rt", "time"] }
diesel = { version = "=2.3.11", default-features = false, features = ["postgres_backend", "uuid"] }
clickhouse = "0.13.3"

[features]
default = ["single"]
single = ["lilyrs/mongodb", "lilyrs/postgresql", "lilyrs/clickhouse", "lilyrs/redis", "lilyrs/queue-client", "lilyrs/websocket-client"]
factory = ["lilyrs/mongodb-factory", "lilyrs/postgresql-factory", "lilyrs/clickhouse-factory", "lilyrs/redis-factory", "lilyrs/queue-client-factory", "lilyrs/websocket-client-factory"]
asyncapi = ["lilyrs/queue-asyncapi"]
