[package]
name = "umbrella-macro-clickhouse"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Only this component is enabled; no other facade feature may mask macro paths.
lilyrs = { package = "lilyrs", path = "../../../../crates/lilyrs", default-features = false }
serde = { version = "1", features = ["derive"] }
clickhouse = "0.13.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["single"]
single = ["lilyrs/clickhouse"]
factory = ["lilyrs/clickhouse-factory"]
