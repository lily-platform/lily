[package]
name = "lily_mongo_repository"
version = "0.1.0"
edition = "2024"
description = "MongoDB repository contracts for Lilyrs collection and repository adapters"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "mongodb", "repository", "crud", "database"]
categories = ["database", "rust-patterns"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[dependencies]
async-trait = "0.1"
mongodb = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
lily_error = { version = "0.1.0", path = "../../foundation/lily_error", features = ["mongodb-driver"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = []
