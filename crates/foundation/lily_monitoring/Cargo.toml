[package]
name = "lily_monitoring"
version = "0.1.0"
edition = "2024"
description = "Application-owned health, readiness, and resource observations"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "monitoring", "health", "readiness", "shutdown"]
categories = ["development-tools::debugging"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[dependencies]
lily_shutdown = { version = "0.1.0", path = "../lily_shutdown" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = []
