[workspace]
resolver = "3"
members = ["crates/foundation/lily_background_service"
    
, "crates/foundation/lily_cancellation", "crates/foundation/lily_config", "crates/foundation/lily_core", "crates/foundation/lily_error", "crates/foundation/lily_http_api_macros", "crates/foundation/lily_http_client", "crates/foundation/lily_injectable_derive", "crates/foundation/lily_injection", "crates/foundation/lily_injection_registry", "crates/foundation/lily_log", "crates/foundation/lily_middleware", "crates/foundation/lily_monitoring", "crates/foundation/lily_process", "crates/foundation/lily_shutdown", "crates/foundation/lily_web_core", "crates/foundation/lily_websocket_client", "crates/foundation/lily_websocket_derive", "crates/framework/lily_consumer", "crates/framework/lily_http_api", "crates/framework/lily_websocket", "crates/integrations/lily_asyncapi", "crates/integrations/lily_clickhouse", "crates/integrations/lily_clickhouse_derive", "crates/integrations/lily_mongo_repository", "crates/integrations/lily_mongo_service", "crates/integrations/lily_mongodb", "crates/integrations/lily_mongodb_derive", "crates/integrations/lily_postgresql", "crates/integrations/lily_postgresql_derive", "crates/integrations/lily_queue", "crates/integrations/lily_queue_client", "crates/integrations/lily_queue_derive", "crates/integrations/lily_queue_registry", "crates/integrations/lily_redis", "crates/integrations/lily_trace", "crates/integrations/lily_trace_macros", "crates/integrations/lily_websocket_redis", "crates/lily"]

[workspace.package] 
description = "asynchronous application framework components for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lily-platform/lily"
homepage = "https://lilyrs.com"
readme = "README.md"
keywords = ["lily", "framework", "async", "web", "backend"]
categories = ["web-programming", "asynchronous", "network-programming"]
rust-version = "1.96.1"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3.31"
linkme = "0.3"
mime = "0.3"
mongodb = "3.9.0"
proc-macro2 = "1.0"
proptest = "1.0"
quote = "1.0"
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
syn = { version = "2.0", features = ["full"] }
tempfile = "3.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
bytes = "1"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
cookie = { version = "0.18.2", default-features = false, features = ["secure"] }
http = "1.0"
httpdate = "1"
itoa = "1"
lily_cancellation = { version = "0.1.0", path = "crates/foundation/lily_cancellation" }
log = "0.4"
mime_guess = "2.0.5"
multer = { version = "=3.1.0", default-features = false, features = ["tokio-io"] }
percent-encoding = "2.3"
pin-project-lite = "0.2.16"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = "1.0"
smallvec = "1.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
zeroize = "1.8.1"
rolling-file = "0.2.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
base64 = "0.22.1"
hmac = "0.12.1"
lily_error = { path = "crates/foundation/lily_error" }
lily_injection = { path = "crates/foundation/lily_injection" }
rand = "0.8"
sha2 = "0.10.9"
subtle = "2.6.1"
tower-http = { version = "0.7.0", default-features = false, features = ["cors", "csrf"] }
tower-layer = "0.3"
tower-service = "0.3"
clickhouse = "0.13.3"
dashmap = "5.5"
headers = "=0.4.1"
http-body-util = "0.1.3"
hyper = { version = "1.11.0", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "http2", "logging", "webpki-roots", "ring", "tls12"] }
hyper-util = { version = "0.1.18", features = ["client", "client-legacy", "server-auto", "http1", "http2", "service", "tokio"] }
ipnet = "2.12"
lapin = { version = "4.10", default-features = false, features = ["default-runtime", "rustls--ring", "rustls-platform-verifier"] }
lily_background_service = { version = "0.1.0", path = "crates/foundation/lily_background_service" }
once_cell = "1"
ring = "0.17.14"
serde_html_form = { version = "=0.4.1", default-features = false, features = ["de", "std"] }
urlencoding = "2.1.3"
utoipa = { version = "=5.5.0", default-features = false, features = ["macros"] }
webpki-roots = "1.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
