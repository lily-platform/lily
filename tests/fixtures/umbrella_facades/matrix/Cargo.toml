queue-fuzzing = ["lilyrs/queue-fuzzing"]
queue-transactional-inbox-mongodb = ["lilyrs/queue-transactional-inbox-mongodb"]
queue-transactional-inbox-mongodb-factory = ["lilyrs/queue-transactional-inbox-mongodb-factory"]
queue-transactional-inbox-postgresql = ["lilyrs/queue-transactional-inbox-postgresql"]
queue-transactional-inbox-postgresql-factory = ["lilyrs/queue-transactional-inbox-postgresql-factory"]
config-transactional-inbox-mongodb = ["lilyrs/config-transactional-inbox-mongodb"]
config-transactional-inbox-postgresql = ["lilyrs/config-transactional-inbox-postgresql"]
websocket-client-di = ["lilyrs/websocket-client-di"]
error-mongodb-driver = ["lilyrs/error-mongodb-driver"]
