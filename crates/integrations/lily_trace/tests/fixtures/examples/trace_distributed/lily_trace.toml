# Distributed Tracing Configuration - OTLP to Jaeger

environment = "development"
enabled = true
level = "info"
service_name = "distributed-trace-demo"
service_version = "1.0.0"

[sampling]
strategy = "always"
rate = 1.0

[export]
console = true

# OTLP export to Jaeger
[export.otlp]
endpoint = "http://localhost:4317"
protocol = "tonic"
timeout = 10
