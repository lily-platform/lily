[package]
name = "lily_postgresql"
version = "0.1.0"
edition = "2024"
description = "Asynchronous Diesel PostgreSQL integration with pooling and scoped transactions"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "postgresql", "diesel", "database", "transaction"]
categories = ["database", "asynchronous"]
rust-version.workspace = true

[features]
default = ["single"]
factory-api = []
single = []
factory = ["factory-api"]
test-support = []

[dependencies]
async-trait = { workspace = true }
deadpool = { version = "0.13.0", default-features = false, features = ["managed", "rt_tokio_1"] }
diesel = { version = "=2.3.11", default-features = false, features = ["postgres_backend", "uuid"] }
diesel-async = { version = "=0.9.2", features = ["deadpool", "migrations", "postgres"] }
diesel_migrations = "=2.3.0"
futures-util = "0.3"
lily_config = { version = "0.1.0", path = "../../foundation/lily_config" }
lily_cancellation = { workspace = true }
lily_error = { version = "0.1.0", path = "../../foundation/lily_error" }
lily_injectable_derive = { version = "0.1.0", path = "../../foundation/lily_injectable_derive" }
lily_injection = { version = "0.1.0", path = "../../foundation/lily_injection" }
lily_injection_registry = { version = "0.1.0", path = "../../foundation/lily_injection_registry" }
lily_postgresql_derive = { version = "0.1.0", path = "../lily_postgresql_derive" }
lily_trace = { version = "0.1.0", path = "../lily_trace" }
linkme = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7.13"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring", "webpki-roots"] }
tracing = { workspace = true }
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
trybuild = "1.0"

[lib]
name = "lily_postgresql"
path = "src/lib.rs"
