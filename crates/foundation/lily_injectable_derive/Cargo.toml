[package]
name = "lily_injectable_derive"
version = "0.1.0"
edition = "2024"
description = "Constructor injection and service registration derives for Lilyrs dependency injection"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "dependency-injection", "derive", "proc-macro", "services"]
categories = ["rust-patterns", "development-tools"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[lib]
proc-macro = true
# Runtime-dependent rustdoc examples are tested by macro_contracts/injection.
doctest = false

[dependencies]
proc-macro2 = "1.0"
proc-macro-crate = "3"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = []
