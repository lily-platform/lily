[package]
name = "lily_injection_registry"
version = "0.1.0"
edition = "2024"
description = "Link-time service registration contracts for Lilyrs dependency injection"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "dependency-injection", "registry", "linkme", "services"]
categories = ["rust-patterns"]
rust-version.workspace = true

[dependencies]
linkme = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
lily_error = { version = "0.1.0", path = "../lily_error" }
futures = "0.3"

[dev-dependencies]
proptest = "1.3"
quickcheck = "1.0"
arbitrary = { version = "1.3", features = ["derive"] }
