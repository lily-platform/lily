[package]
name = "lily-downstream-struct-controller-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Deliberately rename the runtime dependency. Proc-macro expansion must resolve
# this Cargo alias instead of hard-coding `lily_http_api` in generated code.
framework = { package = "lily_http_api", path = "../../../crates/lily_http_api" }
serde = { version = "1", features = ["derive"] }

[workspace]
resolver = "2"
