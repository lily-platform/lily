[package]
name = "lily-macro-contracts-mongodb"
version = "0.0.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
lily_mongodb_derive = { path = "../../../../crates/integrations/lily_mongodb_derive", default-features = false }
lily_mongodb = { path = "../../../../crates/integrations/lily_mongodb", default-features = false }
lily_injection = { path = "../../../../crates/foundation/lily_injection" }
async-trait = { version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
trybuild = "1.0"

[features]
default = ["single"]
single = ["lily_mongodb_derive/single"]
factory = ["lily_mongodb_derive/factory"]
