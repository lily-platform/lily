[package]
name = "lily_queue_registry"
version = "0.1.0"
edition = "2024"
description = "Link-time handler registration contracts for Lilyrs RabbitMQ consumers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "rabbitmq", "registry", "handler", "asyncapi"]
categories = ["network-programming", "rust-patterns"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[features]
default = []
asyncapi = ["dep:lily_asyncapi"]

[dependencies]
linkme = { workspace = true }
lily_error = { version = "0.1.0", path = "../../foundation/lily_error" }
lily_injection = { version = "0.1.0", path = "../../foundation/lily_injection" }
lily_asyncapi = { version = "=0.1.0", path = "../lily_asyncapi", optional = true }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = ["asyncapi"]
