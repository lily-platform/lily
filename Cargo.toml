[workspace]
resolver = "3"
members = ["crates/foundation/lily_background_service"
    
, "crates/foundation/lily_cancellation", "crates/foundation/lily_config", "crates/foundation/lily_core", "crates/foundation/lily_error", "crates/foundation/lily_http_api_macros", "crates/foundation/lily_http_client", "crates/foundation/lily_injectable_derive", "crates/foundation/lily_injection", "crates/foundation/lily_injection_registry", "crates/foundation/lily_log", "crates/foundation/lily_middleware", "crates/foundation/lily_monitoring", "crates/foundation/lily_process", "crates/foundation/lily_shutdown", "crates/foundation/lily_websocket_client", "crates/foundation/lily_websocket_derive", "crates/framework/lily_consumer", "crates/framework/lily_http_api", "crates/framework/lily_websocket", "crates/integrations/lily_asyncapi", "crates/integrations/lily_clickhouse", "crates/integrations/lily_clickhouse_derive", "crates/integrations/lily_mongo_repository", "crates/integrations/lily_mongo_service", "crates/integrations/lily_mongodb", "crates/integrations/lily_mongodb_derive", "crates/integrations/lily_postgresql", "crates/integrations/lily_postgresql_derive", "crates/integrations/lily_queue", "crates/integrations/lily_queue_client", "crates/integrations/lily_queue_derive", "crates/integrations/lily_queue_registry", "crates/integrations/lily_redis", "crates/integrations/lily_trace", "crates/integrations/lily_trace_macros", "crates/integrations/lily_websocket_redis", "crates/lily"]

[workspace.package] 
description = "asynchronous application framework components for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lily-platform/lily"
homepage = "https://lilyrs.com"
readme = "README.md"
keywords = ["lily", "framework", "async", "web", "backend"]
categories = ["web-programming", "asynchronous", "network-programming"]
rust-version = "1.96.1"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3.31"
mime = "0.3"
mongodb = "3.9.0"
proc-macro2 = "1.0"
proptest = "1.0"
quote = "1.0"
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
syn = { version = "2.0", features = ["full"] }
tempfile = "3.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
