queue-transactional-inbox-mongodb = ["lily/queue-transactional-inbox-mongodb"]
queue-transactional-inbox-mongodb-factory = ["lily/queue-transactional-inbox-mongodb-factory"]
queue-transactional-inbox-postgresql = ["lily/queue-transactional-inbox-postgresql"]
queue-transactional-inbox-postgresql-factory = ["lily/queue-transactional-inbox-postgresql-factory"]
config-transactional-inbox-mongodb = ["lily/config-transactional-inbox-mongodb"]
config-transactional-inbox-postgresql = ["lily/config-transactional-inbox-postgresql"]
websocket-client-di = ["lily/websocket-client-di"]
error-mongodb-driver = ["lily/error-mongodb-driver"]
