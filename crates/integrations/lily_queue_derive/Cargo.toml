[package]
name = "lily_queue_derive"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for Lilyrs RabbitMQ queue handlers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "rabbitmq", "queue", "proc-macro", "handler"]
categories = ["network-programming", "development-tools"]
rust-version.workspace = true

[lib]
proc-macro = true

[features]
default = []
asyncapi = ["dep:serde_json"]

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
proc-macro-crate = "3"
serde_json = { version = "1.0", optional = true }
