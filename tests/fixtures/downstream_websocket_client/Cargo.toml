[package]
name = "lily-downstream-websocket-client-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

# Current/N path dependencies are explicit so this independent workspace cannot
# hide an undeclared public API dependency through the Lily workspace root.
lily_injection = { path = "../../../crates/foundation/lily_injection" }
lily_websocket = { path = "../../../crates/framework/lily_websocket" }
lily_websocket_client = { path = "../../../crates/foundation/lily_websocket_client" }

[workspace]
resolver = "2"
