[package]
name = "lily_clickhouse_derive"
version = "0.1.0"
edition = "2024"
description = "Procedural derives for Lilyrs ClickHouse schemas, tables, and repositories"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "clickhouse", "derive", "proc-macro", "database"]
categories = ["database", "development-tools"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[lib]
proc-macro = true

[features]
default = ["single"]
single = []
factory = []

[dependencies]
proc-macro-crate = "3"
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
trybuild = "1.0"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = ["factory"]
