[package]
name = "lily_background_service"
version = "0.1.0"
edition = "2024"
description = "Supervised background services with scoped dependency injection and bounded shutdown"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lilyrs", "background-service", "async", "tokio", "shutdown"]
categories = ["asynchronous", "concurrency"]
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
lily_cancellation.workspace = true
lily_injection.workspace = true

[dev-dependencies]
lily_process = { path = "../lily_process" }
lily_injectable_derive = { path = "../lily_injectable_derive" }
lily_injection_registry = { path = "../lily_injection_registry" }
lily_error.workspace = true
linkme.workspace = true
tokio = { workspace = true, features = ["test-util"] }
