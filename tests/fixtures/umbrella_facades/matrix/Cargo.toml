[package]
name = "umbrella-feature-matrix"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lily = { path = "../../../../crates/lily", default-features = false }

[features]
default = []
consumer = ["lily/consumer"]
http-api = ["lily/http-api"]
websocket = ["lily/websocket"]
websocket-redis = ["lily/websocket-redis"]
clickhouse = ["lily/clickhouse"]
clickhouse-single = ["lily/clickhouse-single"]
clickhouse-factory = ["lily/clickhouse-factory"]
mongodb = ["lily/mongodb"]
mongodb-single = ["lily/mongodb-single"]
mongodb-factory = ["lily/mongodb-factory"]
postgresql = ["lily/postgresql"]
postgresql-single = ["lily/postgresql-single"]
postgresql-factory = ["lily/postgresql-factory"]
queue = ["lily/queue"]
queue-client = ["lily/queue-client"]
queue-client-single = ["lily/queue-client-single"]
queue-client-factory = ["lily/queue-client-factory"]
redis = ["lily/redis"]
redis-single = ["lily/redis-single"]
redis-factory = ["lily/redis-factory"]
trace = ["lily/trace"]
trace-console = ["lily/trace-console"]
config = ["lily/config"]
websocket-client = ["lily/websocket-client"]
websocket-client-single = ["lily/websocket-client-single"]
websocket-client-factory = ["lily/websocket-client-factory"]
