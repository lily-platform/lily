[package]
name = "lily_postgresql_derive"
version = "0.1.0"
edition = "2024"
description = "Procedural derive for Lilyrs Diesel PostgreSQL repository adapters"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "postgresql", "diesel", "derive", "repository"]
categories = ["database", "development-tools"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
syn = { version = "2.0", features = ["extra-traits", "full"] }
quote = "1.0"
proc-macro2 = "1.0"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = []
