[package]
name = "lily_trace_macros"
version = "0.1.0"
edition = "2024"
description = "Attribute macros for Lilyrs method tracing and result classification"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "tracing", "instrumentation", "proc-macro", "async"]
categories = ["development-tools::debugging", "development-tools"]
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
syn = { version = "2.0", features = ["full", "extra-traits", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
