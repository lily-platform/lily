consumer-transactional-inbox-postgresql = ["lily/consumer-transactional-inbox-postgresql"]
consumer-transactional-inbox-postgresql-factory = ["lily/consumer-transactional-inbox-postgresql-factory"]
http-api-fuzzing = ["lily/http-api-fuzzing"]
websocket-fuzzing = ["lily/websocket-fuzzing"]
mongodb-factory-api = ["lily/mongodb-factory-api"]
mongodb-test-support = ["lily/mongodb-test-support"]
postgresql-factory-api = ["lily/postgresql-factory-api"]
