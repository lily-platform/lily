[package]
name = "lily_websocket"
version = "0.1.0"
edition = "2024"
description = "WebSocket application framework with typed controllers and application-owned lifecycle"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "websocket", "realtime", "framework", "async"]
categories = ["web-programming::websocket", "asynchronous"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[features]
default = []
fuzzing = []

[dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-rustls = { workspace = true }
# WebSocket dependencies
tokio-tungstenite = "0.23.1"
futures-util = "0.3"
lily_web_core = { version = "0.1.0", path = "../../foundation/lily_web_core" }
lily_middleware = { version = "0.1.0", path = "../../foundation/lily_middleware" }
lily_websocket_derive = { version = "0.1.0", path = "../../foundation/lily_websocket_derive" }
# Utilities
uuid = { version = "1.3", features = ["v4", "serde"] }
url = "2"
ipnet = { workspace = true }
thiserror = "1.0"
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# Logging
tracing = { workspace = true }
opentelemetry = "0.30"

# Framework dependencies
lily_background_service.workspace = true
lily_injection = { version = "0.1.0", path = "../../foundation/lily_injection" }
lily_config = { version = "0.1.0", path = "../../foundation/lily_config" }
lily_trace = { version = "0.1.0", path = "../../integrations/lily_trace" }
lily_shutdown = { version = "0.1.0", path = "../../foundation/lily_shutdown" }
lily_monitoring = { version = "0.1.0", path = "../../foundation/lily_monitoring" }

# Registry dependencies
linkme = { workspace = true }

[dev-dependencies]
tempfile = "3"
opentelemetry_sdk = { version = "0.30", features = ["testing"] }
tracing-opentelemetry = "0.31"
tracing-subscriber = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
lily_error = { version = "0.1.0", path = "../../foundation/lily_error" }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = []
