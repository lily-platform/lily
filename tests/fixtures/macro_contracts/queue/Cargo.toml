[package]
name = "lily-macro-contracts-queue"
version = "0.0.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
lily_queue_derive = { path = "../../../../crates/integrations/lily_queue_derive" }
lily_injection = { path = "../../../../crates/foundation/lily_injection" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
lily_error = { version = "0.1.0", path = "../../../../crates/foundation/lily_error" }
queue_runtime = { package = "lily_queue", version = "=0.1.0", path = "../../../../crates/integrations/lily_queue" }

[dev-dependencies]
trybuild = "1.0"

[features]
default = []
asyncapi = ["lily_queue_derive/asyncapi", "queue_runtime/asyncapi"]
