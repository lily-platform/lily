[workspace]
resolver = "3"
members = ["models", "shared", "http-api", "websocket", "consumer"]
exclude = ["clients"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96.1"

[workspace.dependencies]
lilyrs = { path = "../crates/lilyrs", default-features = false }
lily-example-models = { path = "models" }
lily-example-shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
