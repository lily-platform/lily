[package]
name = "lily_config"
version = "0.1.0"
edition = "2024"
description = "Validated TOML configuration, environment overrides, and immutable application settings"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "configuration", "toml", "environment", "secrets"]
categories = ["config"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[features]
default = []
transactional-inbox-mongodb = []
transactional-inbox-postgresql = []

[dependencies] 
async-trait = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
serde = { workspace = true }
url = "2.5"
lily_injection = { version = "0.1.0", path = "../lily_injection" }
lily_error = { version = "0.1.0", path = "../lily_error" }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = ["transactional-inbox-mongodb", "transactional-inbox-postgresql"]
