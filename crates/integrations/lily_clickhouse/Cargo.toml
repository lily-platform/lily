[package]
name = "lily_clickhouse"
version = "0.1.0"
edition = "2024"
description = "Experimental asynchronous ClickHouse integration with typed adapters and migrations"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["lilyrs", "clickhouse", "database", "async", "migrations"]
categories = ["database", "asynchronous"]
rust-version.workspace = true
exclude = ["/.vscode/**", "/wip/**", "/fuzz/**"]

[features]
default = ["single"]
single = []
factory = []

[dependencies]
clickhouse = { workspace = true }                                 # ClickHouse driver
tokio = { workspace = true }
tokio-util = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
async-trait = { workspace = true }
lily_config = { version = "0.1.0", path = "../../foundation/lily_config" }
lily_core = { version = "0.1.0", path = "../../foundation/lily_core" }
lily_shutdown = { version = "0.1.0", path = "../../foundation/lily_shutdown" }
lily_error = { version = "0.1.0", path = "../../foundation/lily_error" }
lily_injection = { version = "0.1.0", path = "../../foundation/lily_injection" }
lily_injectable_derive = { version = "0.1.0", path = "../../foundation/lily_injectable_derive" }
lily_injection_registry = { version = "0.1.0", path = "../../foundation/lily_injection_registry" }
lily_trace = { version = "0.1.0", path = "../lily_trace" }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
once_cell = { workspace = true }
linkme = { workspace = true }
lily_clickhouse_derive = { version = "0.1.0", path = "../lily_clickhouse_derive" }
sha2 = "0.10"

[dev-dependencies]
trybuild = "1.0"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = ["factory"]
