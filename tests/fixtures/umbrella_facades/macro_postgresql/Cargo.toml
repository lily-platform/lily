[package]
name = "umbrella-macro-postgresql"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Only this component is enabled; no other facade feature may mask macro paths.
lilyrs = { package = "lilyrs", path = "../../../../crates/lilyrs", default-features = false }
diesel = { version = "=2.3.11", default-features = false, features = ["postgres_backend", "uuid"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["single"]
single = ["lilyrs/postgresql"]
factory = ["lilyrs/postgresql-factory"]
