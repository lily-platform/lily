[package]
name = "umbrella-macro-trace"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Only this component is enabled; no other facade feature may mask macro paths.
lily = { package = "lily", path = "../../../../crates/lily", default-features = false, features = ["trace"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
