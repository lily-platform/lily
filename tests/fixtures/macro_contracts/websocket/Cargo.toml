[package]
name = "lily-macro-contracts-websocket"
version = "0.0.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
lily_websocket_derive = { path = "../../../../crates/foundation/lily_websocket_derive" }
async-trait = { version = "0.1" }
tokio-util = { version = "0.7" }
lily_error = { version = "0.1.0", path = "../../../../crates/foundation/lily_error" }
lily_injection = { version = "0.1.0", path = "../../../../crates/foundation/lily_injection" }
lily_websocket_client = { version = "0.1.0", path = "../../../../crates/foundation/lily_websocket_client" }
lily_websocket = { version = "0.1.0", path = "../../../../crates/framework/lily_websocket" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
trybuild = "1.0"
